# PrusaSlicer -- Ender 3 V3 SE -- PETG
#
#  OUTIL DE VERIFICATION, PAS PROFIL D'IMPRESSION.
#
#  Ce fichier n'existe que pour `make slice` : PrusaSlicer est le seul
#  trancheur pilotable en ligne de commande ici (CuraEngine n'est pas
#  empaquetable), et il repond a UNE question que personne d'autre ne peut
#  trancher automatiquement : "faut-il des supports ?"
#
#  Le profil que l'utilisateur imprime vraiment est dans
#  cura_ender3v3se_petg.md + klipper_petg.cfg. Les valeurs sont alignees, mais
#  un temps sorti d'ici N'EST PAS un temps Cura -- et sous Klipper le temps
#  reel depend surtout de max_accel et de l'input shaper. Traiter les temps
#  comme un ordre de grandeur ; la garde sur les supports, elle, est dure.
#
#  FORMAT : PLAT, sans section. Un `--load` avec des en-tetes [print] /
#  [filament] / [printer] est silencieusement ignore -- PrusaSlicer retombe
#  sur ses defauts (couche 0,3, buse 200, plateau 0) sans rien signaler, et
#  on croit mesurer alors qu'on ne mesure rien. `make slice` verifie donc que
#  les valeurs sont bien arrivees avant de croire le resultat.

# -- geometrie des couches
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 20%
fill_pattern = gyroid
extrusion_width = 0.42
first_layer_extrusion_width = 0.42

# -- vitesses. 10 mm3/s est le plafond de la hotend d'origine en PETG :
#    c'est LUI qui gouverne, pas les vitesses nominales.
max_volumetric_speed = 10
perimeter_speed = 100
external_perimeter_speed = 50
infill_speed = 120
solid_infill_speed = 100
top_solid_infill_speed = 80
travel_speed = 200
first_layer_speed = 50
max_print_speed = 200

# -- accelerations : cas 1 de klipper_petg.cfg (pas d'input shaper calibre)
default_acceleration = 3000
perimeter_acceleration = 2000
external_perimeter_acceleration = 1500
infill_acceleration = 3000
first_layer_acceleration = 1000

# -- zmin = 0 partout, tous les percages verticaux. La garde 8 verifie que
#    ca suffit : c'est la formulation forte de zmin = 0 que cabas-velo
#    reclame dans son verify.py depuis le debut.
support_material = 0
support_material_auto = 1
skirts = 1
skirt_distance = 3
brim_width = 0

# -- matiere
filament_type = PETG
temperature = 235
first_layer_temperature = 240
# 70 et pas 80 : le PETG colle assez a la tole PC/PEI pour en arracher des
# morceaux. Baton de colle en agent de demoulage, refroidissement complet.
bed_temperature = 70
first_layer_bed_temperature = 70
min_fan_speed = 40
max_fan_speed = 40
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 15
filament_diameter = 1.75
extrusion_multiplier = 1
filament_density = 1.27
filament_cost = 25

# -- machine
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
# Direct drive (Sprite).
retract_length = 1
retract_speed = 40
retract_lift = 0.2
gcode_flavor = marlin2
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 3000,1000
machine_max_acceleration_y = 3000,1000
machine_max_acceleration_extruding = 3000,1250
machine_max_acceleration_retracting = 3000,1250
machine_max_acceleration_travel = 3000,1500
machine_max_feedrate_x = 200,200
machine_max_feedrate_y = 200,200
