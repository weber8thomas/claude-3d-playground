# Klipper — Ender 3 V3 SE — PETG
#
# Extrait a fusionner dans printer.cfg. Ce qui est ici NE PEUT PAS etre
# rattrape par un profil Cura : ce sont des reglages machine.
#
# La partie Cura est dans cura_ender3v3se_petg.md. Une seule autorite sur les
# accelerations, et c'est ce fichier -- desactive Enable Acceleration Control
# et Enable Jerk Control dans Cura, sinon ses M204/M205 se battent avec la
# config machine.

# =====================================================================
#  PRESSURE ADVANCE -- le reglage de la rondeur des Ø6
# =====================================================================
#
#  C'est lui qui decide si un percage Ø6,4 sort rond ou pate a vitesse : il
#  compense le retard de la pression dans la buse quand la vitesse change,
#  donc exactement ce qui se passe en permanence sur un petit cercle.
#
#  0,04 est un point de DEPART pour du PETG en direct drive (Sprite), pas une
#  valeur a copier. Elle depend de ta buse, de ta bobine et de ta temperature.
#  Calibre-la : https://www.klipper3d.org/Pressure_Advance.html
#    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.005
#
[extruder]
pressure_advance: 0.04
pressure_advance_smooth_time: 0.03
# Marge pour une premiere couche elargie ou une jupe large. Sans ca, Klipper
# refuse l'extrusion avec "Move exceeds maximum extrusion".
max_extrude_cross_section: 5

# =====================================================================
#  ACCELERATIONS -- DEUX CAS, et il faut savoir dans lequel tu es
# =====================================================================
#
#  Le firmware d'origine de la V3 SE n'a pas d'input shaper. Sous Klipper, tu
#  peux en avoir un -- mais seulement si tu l'as CALIBRE. Tant que la section
#  [input_shaper] plus bas est vide, tu es dans le cas 1.
#
#  CAS 1 -- pas d'input shaper calibre
#    max_accel: 3000
#    Cura : Outer Wall Speed = 50 mm/s
#    Au-dela, le ringing deforme les petits cercles : un Ø6 sort facette et
#    ovale. C'est precisement la cote que le gabarit sert a mesurer.
#
#  CAS 2 -- input shaper calibre (ADXL345, ou tour de ringing)
#    max_accel: 5000 a 8000
#    Cura : Outer Wall Speed = 90 mm/s
#
[printer]
max_accel: 3000
square_corner_velocity: 5.0

# =====================================================================
#  INPUT SHAPER -- a remplir par TA calibration, jamais par copie
# =====================================================================
#
#  Les frequences de resonance dependent de ton chassis, de son montage, de
#  la hauteur d'impression et de ce qu'il y a sur le plateau. Copier celles
#  d'une autre machine ne corrige rien et peut empirer le resultat.
#
#  Avec un ADXL345 :
#      SHAPER_CALIBRATE
#      SAVE_CONFIG
#  Sans accelerometre, la tour de ringing donne un resultat utilisable :
#      https://www.klipper3d.org/Resonance_Compensation.html
#
#  Decommente et remplis APRES calibration -- puis passe max_accel au cas 2.
#
# [input_shaper]
# shaper_type_x: mzv
# shaper_freq_x: 00.0
# shaper_type_y: mzv
# shaper_freq_y: 00.0

# =====================================================================
#  DEBIT -- le vrai plafond de cette machine
# =====================================================================
#
#  La hotend d'origine plafonne autour de 10 mm3/s en PETG. Klipper ne
#  limite pas le debit volumetrique (contrairement a certains trancheurs) :
#  c'est a Cura de ne pas depasser.
#
#      vitesse_max = 10 / (hauteur_de_couche x largeur_de_ligne)
#      0,2 x 0,42  ->  120 mm/s
#
#  Verifie ton plafond reel avant de monter :
#      https://www.klipper3d.org/Pressure_Advance.html#extruder-flow-rate
